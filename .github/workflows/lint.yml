name: Python Quality Check

# Trigger the workflow on push or PR to these branches
on:
  push:
    branches: [ "main", "dev", "feature/**" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Check out the code from the repo
    - uses: actions/checkout@v3

    # Set up Python 3.9
    - name: Set up Python 3.9
      uses: actions/setup-python@v3
      with:
        python-version: "3.9"

    # Install dependencies (Netmiko, Rich, Pylint)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # Run Pylint
    # We ignore the 'logs' folder and enforce a passing score of 7/10
    - name: Analysing code with Pylint
      run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)/src
        pylint --fail-under=7.0 src/